services:
  db:
    image: postgres:16-alpine
    container_name: global-exchange-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: global_exchange_bd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 para no chocar con el PostgreSQL local (servicio Windows en 5432).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d global_exchange_bd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
