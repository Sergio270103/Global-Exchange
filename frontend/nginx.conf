# nginx.conf - Gateway de producción (PI-88 / PI-96)
#
# Única puerta de entrada del sistema. Recibe todo lo que llega por el túnel
# de ngrok y lo reparte dentro de la red de Docker:
#   /        -> aplicación React (archivos estáticos del build de Vite)
#   /api/    -> backend Django (servicio "web")
#   /auth/   -> Keycloak (servicio "keycloak", KC_HTTP_RELATIVE_PATH=/auth)

# ngrok termina el HTTPS y avisa el esquema original con X-Forwarded-Proto.
# Si la petición es local (sin ngrok) se usa el esquema real.
map $http_x_forwarded_proto $ge_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # DNS interno de Docker. Con las variables de abajo nginx resuelve los
    # servicios en cada petición: arranca aunque el backend o Keycloak todavía
    # no estén listos y los sigue encontrando si se recrean los contenedores.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ge_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # Aplicación React (SPA): cualquier ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea, así un nuevo despliegue se ve enseguida.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API de Django (incluye el webhook de Stripe: /api/payments/webhook/).
    location /api/ {
        set $ge_backend http://web:8000;
        proxy_pass $ge_backend;
        proxy_read_timeout 90s;
    }

    # Keycloak: login, registro, verificación de correo y consola de admin.
    location /auth/ {
        set $ge_keycloak http://keycloak:8080;
        proxy_pass $ge_keycloak;
        # Keycloak responde con cabeceras grandes (cookies de sesión).
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }
}
