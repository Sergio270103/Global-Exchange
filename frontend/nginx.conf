# nginx.conf - Configuración para el frontend en producción (PI-88)
# Sirve la aplicación React (SPA) y proxyea /api al backend de Django.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos del build de Vite
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de llamadas a la API hacia el backend de Django
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}